<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productiv.ai</title>

    <!-- Critical CSS inline -->
    <style>
      /* Minimal critical CSS for initial render */
      .dark {
        color-scheme: dark;
      }
      #root {
        min-height: 100vh;
      }
    </style>

    <!-- Preload critical resources -->
    <link rel="preload" href="/assets/index.css" as="style" />
    <link
      rel="preload"
      href="/icons/icon-192x192.svg"
      as="image"
      type="image/svg+xml"
    />
    <link
      rel="preload"
      href="/app-ss.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/app-ss-dark.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Preload critical JavaScript -->
    <link rel="modulepreload" href="/assets/index.js" />
    <link rel="stylesheet" href="/assets/index.css" />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Meta tags for better SEO and performance -->
    <meta
      name="productivity-indian-app"
      content="Productiv.ai - Boost your productivity with AI"
    />
    <meta name="theme-color" content="#000000" />

    <!-- PWA support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Productiv.ai" />
  </head>
  <body class="transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
